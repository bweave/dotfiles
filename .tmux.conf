set -g allow-passthrough on # allows OSC sequences (e.g. Ghostty notifications) to reach the host terminal
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -g bell-action other
setw -g monitor-bell on
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g status-interval 1
set -g status-position top
set-option -g mouse on
set-option -g set-titles on
set-option -g set-titles-string '#T'
set -g focus-events on

set -g prefix C-a
bind C-a send-prefix
unbind C-b

unbind -
bind-key - split-window -v -c '#{pane_current_path}'
bind-key \\ split-window -h -c '#{pane_current_path}'
bind-key     r source-file ~/.tmux.conf \; display-message "Config reloaded..."
bind-key     C-b send-keys 'tat && exit' 'C-m' # Break out to new session
bind-key -n  M-b break-pane -d
bind-key     j command-prompt -p "join pane from: "  "join-pane -h -s '%%'"
bind-key     C-s display-panes\; command-prompt -p "pane #: "  "swap-pane -t '%%'"
bind-key     C-l send-keys "C-l"
bind-key     ? list-keys
bind-key     . command-prompt -p "pane title: " "select-pane -T '%%'; set-option -p @custom_title 1; set-option -p allow-rename off"
bind-key     A new-window -d -n aws-login "pco aws-login"
bind-key     a display-popup -E -w 60% -h 40% "pco aws-login"
bind-key     t display-popup -E -w 60% -h 40% -d '#{pane_current_path}'

# Switch windows with opt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Mouse scroll — override tmux 3.6+ defaults that only handle inner sessions
bind-key -T root WheelUpPane \
  if-shell -Ft= "#{mouse_any_flag}" "send-keys -M" \
  "if-shell -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T root WheelDownPane \
  if-shell -Ft= "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# Setup 'v' to begin selection as in Vim
bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down
unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Update default binding of `Enter` to also use copy-pipe
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

###########################
# Sessions & swithing
###########################
set-option -g @fzf-goto-session-only 'true'
set -g @fzf-goto-session 's' # Ctrl-a + s

# OS specifix configurations
if-shell "uname | grep -q Darwin" "source-file ~/.tmux.conf.osx" "source-file ~/.tmux.conf.linux"

###########################
# Plugin settings
###########################
set -g @continuum-restore 'on'

###########################
# List of plugins
###########################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'thuanOwa/tmux-fzf-session-switch'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'TanglingTreats/tmux-everforest'

# Theme file
source-file ~/.tmux-theme-subtle.conf

# keep this at the bottom
run '~/.tmux/plugins/tpm/tpm'

# Override tmux-yank's MouseDragEnd1Pane binding — "and-cancel" exits copy mode
# and jumps to the bottom; "no-clear" copies but stays in place
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "reattach-to-user-namespace pbcopy"
