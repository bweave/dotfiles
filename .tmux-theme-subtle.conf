## COLORSCHEME: subtle
## Designed to blend into the terminal background with minimal contrast.
## Uses muted, low-contrast colors — no bold accents, no powerline glyphs.
set-option -g status "on"
set -g status-interval 2

# Use "default" as the background so it inherits the terminal's own bg
set-option -g status-fg '#859289'
set-option -g status-bg default

set-option -g mode-style fg='#2d353b',bg='#859289'

# default statusbar colors
set-option -g status-style "fg=#859289,bg=default"


# ---- Windows ----
set-window-option -g window-status-style fg='#859289',bg=default
set-window-option -g window-status-activity-style fg='#d3c6aa',bg=default
set-window-option -g window-status-current-style fg='#d3c6aa',bg=default

# ---- Pane ----
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set-option -g pane-border-style fg='#566369'
set-option -g pane-active-border-style fg='#a7c080'
set-option -g pane-border-lines single
set-option -g pane-border-indicators colour
set-option -g pane-border-status off
set-option -g pane-border-format ' #{?@custom_title,#{pane_title},#{pane_current_command}} '

# Show pane border status only when window has multiple panes
set-hook -g after-split-window "if-shell '[ \#{window_panes} -gt 1 ]' 'set pane-border-status top'"
set-hook -g pane-exited "if-shell '[ \#{window_panes} -le 1 ]' 'set pane-border-status off'"

# pane number display
set-option -g display-panes-active-colour '#859289'
set-option -g display-panes-colour '#5c6a72'

# ---- Command ----
set-option -g message-style fg='#d3c6aa',bg=default
set-option -g message-command-style fg='#859289',bg=default

# ---- Miscellaneous ----
set-window-option -g clock-mode-colour '#5c6a72'
set-window-option -g window-status-bell-style fg='#e67e80',bg=default

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#a7c080,bold] #S #[default] '

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right ''

set -g window-status-separator ''
set -g window-status-format " #I:#W"
set -g window-status-current-format " #I:#W"
